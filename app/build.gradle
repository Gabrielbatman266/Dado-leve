plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gabriel.dadoleve'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gabriel.dadoleve'
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // assina com a chave de debug para o APK instalar direto no celular
            signingConfig signingConfigs.debug
        }
    }

    // o jogo é o mesmo arquivo de /docs (também serve para o GitHub Pages)
    sourceSets {
        main.assets.srcDirs = ['../docs']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
